# Configuration Docker Compose pour le déploiement sur Raspberry Pi (Production & Dev)
version: '3.8'

services:
  ctr-roster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-ctr_roster_bot}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Production}
      - Discord__Token=${DISCORD_BOT_TOKEN}
      - Discord__DevGuildId=${DISCORD_DEV_GUILD_ID:-0}
      - Discord__AdminRoleId=${DISCORD_ADMIN_ROLE_ID:-0}
      - Discord__AdminUserId=${DISCORD_ADMIN_USER_ID:-0}
      - ConnectionStrings__Default=Data Source=/app/data/${SQLITE_DB_NAME:-ctr_roster.db};Cache=Shared
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
